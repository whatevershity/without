<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>without</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=splitflap1" />
  </head>
  <body>
    <main class="page">
      <p class="line">
        wild
        <a class="without-link" href="/" aria-label="without">
          <!--
            Mechanizm jak tablica klapkowa / pragotron:
            litery klapią w dół po kolei (without → with).
          -->
          <span class="board" aria-hidden="true">
            <span class="tile" style="--i: 0">
              <span class="flap">
                <span class="face front">w</span>
                <span class="face back">w</span>
              </span>
              <span class="hinge"></span>
            </span>
            <span class="tile" style="--i: 1">
              <span class="flap">
                <span class="face front">i</span>
                <span class="face back">i</span>
              </span>
              <span class="hinge"></span>
            </span>
            <span class="tile" style="--i: 2">
              <span class="flap">
                <span class="face front">t</span>
                <span class="face back">t</span>
              </span>
              <span class="hinge"></span>
            </span>
            <span class="tile" style="--i: 3">
              <span class="flap">
                <span class="face front">h</span>
                <span class="face back">h</span>
              </span>
              <span class="hinge"></span>
            </span>
            <span class="tile" style="--i: 4">
              <span class="flap">
                <span class="face front">o</span>
                <span class="face back">&nbsp;</span>
              </span>
              <span class="hinge"></span>
            </span>
            <span class="tile" style="--i: 5">
              <span class="flap">
                <span class="face front">u</span>
                <span class="face back">&nbsp;</span>
              </span>
              <span class="hinge"></span>
            </span>
            <span class="tile" style="--i: 6">
              <span class="flap">
                <span class="face front">t</span>
                <span class="face back">&nbsp;</span>
              </span>
              <span class="hinge"></span>
            </span>
          </span>
        </a>
        frame
      </p>
    </main>
  </body>
</html>
