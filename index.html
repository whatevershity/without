<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>without</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=splitflap4" />
  </head>
  <body>
    <main class="page">
      <p class="line">
        wild
        <a class="without-link" href="/" aria-label="without">
          <!--
            Anatomia tablicy klapkowej: górna połowa klapie w dół
            i odsłania nową literę (without → with), wszystkie naraz.
          -->
          <span class="board" aria-hidden="true">
            <span class="tile" style="--i: 0" data-from="w" data-to="w"></span>
            <span class="tile" style="--i: 1" data-from="i" data-to="i"></span>
            <span class="tile" style="--i: 2" data-from="t" data-to="t"></span>
            <span class="tile" style="--i: 3" data-from="h" data-to="h"></span>
            <span class="tile" style="--i: 4" data-from="o" data-to=" "></span>
            <span class="tile" style="--i: 5" data-from="u" data-to=" "></span>
            <span class="tile" style="--i: 6" data-from="t" data-to=" "></span>
          </span>
        </a>
        frame
      </p>
    </main>
    <script src="splitflap.js"></script>
  </body>
</html>
