<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>with</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=hero-grid18" />
  </head>
  <body>
    <main class="page">
      <!--
        HERO 1440×1024: marginesy 360px | środek = 12 kolumn (1→12 od lewej).
        Umieszczanie: class="place" + data-col="3" data-span="2"  ⇒ kolumny 3–4.
      -->
      <section class="hero" aria-label="Hero">
        <div class="hero-grid">
          <div class="col-guides" aria-hidden="true">
            <span data-n="1"></span>
            <span data-n="2"></span>
            <span data-n="3"></span>
            <span data-n="4"></span>
            <span data-n="5"></span>
            <span data-n="6"></span>
            <span data-n="7"></span>
            <span data-n="8"></span>
            <span data-n="9"></span>
            <span data-n="10"></span>
            <span data-n="11"></span>
            <span data-n="12"></span>
          </div>

          <div
            class="sound-meta place"
            data-col="5"
            data-span="2"
            aria-hidden="true"
          >
            <span class="sound-word">sound</span>
            <span class="answer">
              <span class="no">no</span>
              <span class="yes">yes</span>
            </span>
          </div>

          <p class="line place" data-col="3" data-span="10">
            wild
            <a class="without-link" href="/without/" aria-label="with">
              <span class="board" aria-hidden="true">
                <span class="tile tile-keep" style="--i: 0" data-from="w" data-to="w"></span>
                <span class="tile tile-keep" style="--i: 1" data-from="i" data-to="i"></span>
                <span class="tile tile-keep" style="--i: 2" data-from="t" data-to="t"></span>
                <span class="tile tile-keep" style="--i: 3" data-from="h" data-to="h"></span>
                <span class="tile tile-out" style="--i: 0" data-from=" " data-to="o"></span>
                <span class="tile tile-out" style="--i: 1" data-from=" " data-to="u"></span>
                <span class="tile tile-out" style="--i: 2" data-from=" " data-to="t"></span>
              </span>
            </a>
            frame
          </p>
        </div>
      </section>
    </main>
    <script src="splitflap.js"></script>
    <script src="grid.js"></script>
  </body>
</html>
